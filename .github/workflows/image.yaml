name: build-image
on:
  push:
    branches: [master]
    paths:
      - 'sbb/**'
      - '.github/workflows/image.yml'

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Test and build jar
        working-directory: sbb
        run: chmod +x gradlew && ./gradlew test bootJar --no-daemon
      - name: Prepare docker context
        working-directory: sbb
        run: |
          mkdir ctx
          cp build/libs/*-SNAPSHOT.jar ctx/app.jar
          cp Dockerfile.ci ctx/Dockerfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: sbb/ctx
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/oncethreedays-hue/sbb:latest