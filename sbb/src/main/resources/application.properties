spring.application.name=sbb
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sbb?characterEncoding=UTF-8&serverTimezone=Asia/Tokyo}
spring.datasource.username=${DB_USERNAME:sbb}
spring.datasource.password=${DB_PASSWORD:123}


spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

jwt.secret=${JWT_SECRET:spring-boot-board-project-very-long-and-secure-secret-key-for-jwt-token-generation-2026-sbb}
app.admin.username=${ADMIN_USERNAME:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.email=${ADMIN_EMAIL:}

mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.local-cache-scope=statement

management.endpoints.web.exposure.include=health