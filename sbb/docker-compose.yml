services:
  db:
    image: mysql:8.4
    container_name: sbb-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sbb
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: sbb-app
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      DB_URL: jdbc:mysql://db:3306/sbb?characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
    ports:
      - "8080:8080"

volumes:
  mysql-data: