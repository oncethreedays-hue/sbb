services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: sbb
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Tokyo
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
      --performance-schema=OFF
      --innodb-buffer-pool-size=64M
      --max-connections=30
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 20

  app:
    image: ghcr.io/oncethreedays-hue/sbb:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      DB_URL: jdbc:mysql://db:3306/sbb?characterEncoding=UTF-8&serverTimezone=Asia/Tokyo
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx320m -XX:+UseSerialGC"
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: "5"
    ports:
      - "8080:8080"

volumes:
  mysql-data: